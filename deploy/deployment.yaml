apiVersion: apps/v1
kind: Deployment
metadata:
  name: kavira
  labels: { app.kubernetes.io/name: kavira }
spec:
  replicas: 1   # state (incidents, audit log) is in memory: do not scale out
  selector:
    matchLabels: { app.kubernetes.io/name: kavira }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kavira }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: kavira
          image: ghcr.io/zyvorai/kavira:0.1.0
          args: ["serve", "-addr", "0.0.0.0:8080"]
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: KAVIRA_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: kavira-auth, key: admin-password } }
            - name: KAVIRA_SESSION_KEY
              valueFrom: { secretKeyRef: { name: kavira-auth, key: session-key } }
            - { name: KAVIRA_COOKIE_SECURE, value: "1" }
          readinessProbe: { httpGet: { path: /api/v1/health, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /api/v1/health, port: http }, periodSeconds: 20 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
