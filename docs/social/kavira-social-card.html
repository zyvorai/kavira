<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>KAVIRA share card</title>
<style>
:root{--bg:#0b0b0d;--panel:#161618;--line:rgba(255,255,255,.12);--text:#f5f5f7;--dim:#a1a1a6;--orange:#ff7a1a;--deep:#c2410c;--green:#30d158}
*{box-sizing:border-box}html,body{margin:0}
body{width:1600px;height:900px;overflow:hidden;position:relative;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
.glow{position:absolute;inset:0;background:radial-gradient(900px 460px at 50% -10%,rgba(255,122,26,.32),transparent 70%)}
.wrap{position:absolute;inset:80px 96px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.mark{width:96px;height:96px;border-radius:24px;background:linear-gradient(180deg,var(--orange),var(--deep));display:grid;place-items:center;font-size:58px;font-weight:700}
.name{margin-top:28px;font-size:30px;letter-spacing:.3em;font-weight:650;color:var(--dim)}
h1{margin:22px 0 0;font-size:112px;line-height:1.02;letter-spacing:-.04em;max-width:1280px}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--orange),#ffb36b);-webkit-background-clip:text;color:transparent}
p{margin:30px 0 0;font-size:36px;line-height:1.35;color:var(--dim);max-width:1100px}
.chips{display:flex;gap:14px;margin-top:44px}.chips span{font-size:24px;padding:9px 22px;border-radius:99px;border:1px solid var(--line);background:var(--panel)}
.chips .hit{color:var(--green);border-color:rgba(48,209,88,.5)}
</style></head><body><div class="glow"></div>
<div class="wrap"><div class="mark">Z</div><div class="name">KAVIRA</div>
<h1>Turn an outage into a <em>reproducible test.</em></h1>
<p>Evidence in. Isolated reproducer, one-factor experiments, and a repair package out. Execution is the verdict.</p>
<div class="chips"><span>Container OOM</span><span>Network timeout</span><span>Config regression</span><span class="hit">Repair held</span></div></div>
</body></html>
