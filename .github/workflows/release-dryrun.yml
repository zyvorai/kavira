name: Release dry run

on:
  pull_request:
    paths: ["Dockerfile", ".dockerignore", ".github/workflows/release*.yml", "cmd/**", "go.mod"]

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # Same multi-arch build as release.yml, without pushing or signing.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=dryrun
          cache-from: type=gha
          cache-to: type=gha,mode=max
